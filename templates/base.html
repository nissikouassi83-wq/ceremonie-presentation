<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Enquête de satisfaction — Cérémonie IM2S 2027{% endblock %}</title>
<style>
:root{--navy:#102f48;--navy2:#1b5265;--orange:#e57935;--mint:#b8d8c9;--bg:#f1f5f2;--ink:#20313a;--mute:#64747a;--line:#d9e3df;--ok:#287c5b;--bad:#b74642;--paper:#fff;--shadow:0 18px 46px rgba(16,47,72,.12)}
*{box-sizing:border-box}
html{min-width:320px;scroll-behavior:smooth}
body{margin:0;font-family:"Segoe UI",Tahoma,sans-serif;background:radial-gradient(ellipse at 8% 38%,rgba(184,216,201,.26),transparent 34%),var(--bg);color:var(--ink);line-height:1.6}
.hero{position:relative;isolation:isolate;overflow:hidden;background-color:var(--navy);background-image:radial-gradient(rgba(255,255,255,.1) .8px,transparent .8px),linear-gradient(115deg,#102f48 0%,#17475a 72%,#286658 100%);background-size:18px 18px,cover;color:#fff;padding:34px 24px 96px;clip-path:polygon(0 0,100% 0,100% 83%,0 100%)}
.hero .in{max-width:900px;margin:0 auto;padding-left:112px;position:relative}
.cnps-logo{position:absolute;top:0;left:0;width:86px;height:auto;background:#fff;border-radius:3px;padding:4px;box-shadow:0 4px 16px rgba(0,0,0,.14)}
.hero .in>.badge{display:table;margin-left:auto}
.badge{display:inline-block;background:var(--mint);color:var(--navy);font-size:11px;font-weight:800;text-transform:uppercase;padding:5px 11px;border-radius:3px}
.hero h1{max-width:780px;font-family:"Palatino Linotype",Baskerville,Georgia,serif;font-size:34px;line-height:1.16;margin:15px 0 8px;font-weight:700}
.hero p{margin:0;color:rgba(255,255,255,.78);font-size:14px}
.progress{height:7px;background:rgba(255,255,255,.18);border-radius:10px;margin-top:20px;overflow:hidden;max-width:620px}
.progress span{display:block;height:100%;background:var(--orange);border-radius:inherit;transition:width .35s ease}
.wrap{max-width:900px;margin:-56px auto 44px;padding:0 20px;position:relative}
.card{background:var(--paper);border:1px solid rgba(16,47,72,.07);border-top:3px solid var(--orange);border-radius:7px;box-shadow:var(--shadow);padding:30px;margin-bottom:18px}
.card>p:first-child{font-size:16px;margin-top:0}
.q{padding:20px 0;border-bottom:1px solid var(--line)}.q:last-of-type{border-bottom:0}
.q h3{margin:0 0 5px;font-size:16px;line-height:1.45}.q h3 b{color:var(--orange);margin-right:7px;font-variant-numeric:tabular-nums}
.hint{font-size:13px;color:var(--mute);margin:0 0 10px}
.err{color:var(--bad);font-size:13px;font-weight:700;margin-top:7px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:9px;margin-top:12px}
.opt input,.pill input{position:absolute;opacity:0;width:1px;height:1px}
.opt span{display:block;height:100%;border:1px solid var(--line);border-radius:5px;padding:11px 13px;cursor:pointer;font-size:14px;transition:background-color .15s,border-color .15s}
.opt input:checked+span{border-color:var(--navy2);background:#eaf3ef;font-weight:650}
.opt span:hover{border-color:var(--navy2)}
.opt input:focus-visible+span,.pill input:focus-visible+span{outline:3px solid rgba(229,121,53,.45);outline-offset:2px}
.autre{margin-top:9px;width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:5px;font:inherit}
.mx{overflow-x:auto;margin-top:10px;border:1px solid var(--line);border-radius:5px}
.mx table{border-collapse:collapse;width:100%;min-width:560px;font-size:14px}
.mx th{font-size:12px;color:var(--mute);font-weight:700;padding:9px 5px;text-align:center;background:#f4f7f5}
.mx td{padding:10px 5px;border-top:1px solid var(--line);text-align:center}
.mx td:first-child{text-align:left;padding-left:10px;padding-right:10px}
.mx tr.bad td:first-child{color:var(--bad);font-weight:700}
.mx input{width:20px;height:20px;accent-color:var(--navy2);cursor:pointer}
.nps{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
.pill span{display:flex;align-items:center;justify-content:center;width:42px;height:42px;border:1px solid var(--line);border-radius:5px;cursor:pointer;font-weight:700;transition:background-color .15s,border-color .15s}
.pill input:checked+span{background:var(--navy2);border-color:var(--navy2);color:#fff}
.nps-l{display:flex;justify-content:space-between;gap:14px;font-size:12px;color:var(--mute);margin-top:8px;max-width:540px}
input[type=text],textarea,select{color:var(--ink)}
.autre:focus,textarea:focus,select:focus{outline:3px solid rgba(27,82,101,.18);border-color:var(--navy2)}
textarea{width:100%;min-height:100px;padding:11px 13px;border:1px solid var(--line);border-radius:5px;font:inherit;resize:vertical}
.nav{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:18px}
.btn{background:var(--orange);color:#fff;border:0;border-radius:4px;padding:12px 22px;font:inherit;font-weight:700;cursor:pointer;text-decoration:none;display:inline-block;text-align:center;transition:transform .15s,background-color .15s}
.btn:hover{background:#c65d27;transform:translateY(-1px)}
.btn:focus-visible{outline:3px solid rgba(229,121,53,.4);outline-offset:3px}
.btn.ghost{background:#fff;color:var(--navy);border:1px solid var(--line)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:22px 0}
.stat{min-width:0;background:#edf3ef;border-left:3px solid var(--mint);border-radius:4px;padding:15px 10px;text-align:center}
.stat b{display:block;font-size:25px;color:var(--navy);line-height:1.2}.stat small{color:var(--mute)}
.legal{font-size:12px;color:var(--mute);margin:15px 0 0}
.foot{text-align:center;font-size:12px;color:var(--mute);padding:0 16px 30px}
@media(max-width:600px){
	.hero{padding:25px 18px 78px;clip-path:polygon(0 0,100% 0,100% 91%,0 100%)}
	.hero .in{padding:72px 0 0}
	.cnps-logo{width:56px}
	.hero h1{font-size:27px;max-width:600px}
	.wrap{margin-top:-43px;padding:0 12px}
	.card{padding:20px 17px}
	.stats{gap:7px}.stat{padding:12px 6px}.stat b{font-size:21px}.stat small{font-size:12px}
	.nav{align-items:stretch}.nav .btn{padding:11px 13px;flex:1}
	.nps{gap:5px}.pill span{width:38px;height:40px}
	.nps-l{font-size:11px}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition:none!important}}
</style>
{% block head %}{% endblock %}
</head>
<body>
{% block body %}{% endblock %}
</body>
</html>
